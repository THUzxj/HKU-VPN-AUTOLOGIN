name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Core, IPC and headless GUI tests
        run: |
          dotnet run --project gui/HkuVpn.Tests/HkuVpn.Tests.csproj -c Release -- .
          if ($LASTEXITCODE -ne 0) { throw 'GUI tests failed.' }
      - name: Offline Windows script tests
        run: |
          & tests/Test-Config.ps1
          & tests/Test-Domains.ps1
          & tests/Test-Disconnect.ps1
          & tests/Test-GuiBridge.ps1
      - name: Build portable package and source archive
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          & ./Package-Gui.ps1 -Destination (Join-Path $PWD 'dist/hku-vpn-windows-x64.zip')
          & ./Export-Source.ps1 -Destination (Join-Path $PWD 'dist/hku-vpn-autologin-source.zip')
      - name: Verify portable EXE and package privacy
        run: |
          & tests/Test-Package.ps1 -Archive (Join-Path $PWD 'dist/hku-vpn-windows-x64.zip')
          $sums = Get-ChildItem dist/*.zip | Sort-Object Name | ForEach-Object {
            (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name
          }
          $sums | Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Store downloadable build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: dist
      - name: Publish tested assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            extra=()
            if [[ "$RELEASE_TAG" == *-* ]]; then extra+=(--prerelease); fi
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
              --title "HKU VPN $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md "${extra[@]}"
            gh release edit "$RELEASE_TAG" --draft=false
          fi
